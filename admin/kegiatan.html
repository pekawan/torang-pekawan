<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Kegiatan | Admin Torang Pekawan</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark" style="background:#43307c">
    <div class="container">
      <a class="navbar-brand" href="index.html">Admin Pekawan</a>
      <div class="text-white d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-light" href="index.html">Jadwal</a>
        <a class="btn btn-sm btn-outline-light" href="kegiatan.html">Kegiatan</a>
        <a class="btn btn-sm btn-outline-light" href="dokumentasi.html">Dokumentasi</a>
        <span class="ms-2" id="admin-email"></span>
        <button class="btn btn-sm btn-light" id="logout">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3">Kelola Kegiatan</h1>
    <p>Unggah foto dan judul kegiatan. Foto akan tampil di halaman <strong>Kegiatan</strong> publik.</p>

    <div id="msg" class="alert alert-danger" hidden></div>

    <div class="card card-body mb-4">
      <h2 class="h5">Tambah kegiatan</h2>
      <form id="kegiatan-form">
        <label class="form-label">Judul kegiatan</label>
        <input id="judul-kegiatan" class="form-control mb-2" placeholder="Mis. Ibadah Pemuda" required>

        <label class="form-label">Foto kegiatan (JPG, PNG, WEBP, maks. 5 MB)</label>
        <input id="foto-kegiatan" type="file" accept="image/jpeg,image/png,image/webp" class="form-control mb-3" required>

        <button class="btn btn-primary">Unggah kegiatan</button>
      </form>
    </div>

    <div class="card card-body">
      <h2 class="h5">Daftar kegiatan</h2>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th style="width:120px">Preview</th>
              <th>Judul</th>
              <th>Path file</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="admin-kegiatan"></tbody>
        </table>
      </div>
    </div>

    <a class="d-inline-block mt-4" href="../index.html">Lihat situs publik</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
