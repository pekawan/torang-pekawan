<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelola Dokumentasi | Admin Torang Pekawan</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark" style="background:#43307c">
  <div class="container">
    <a class="navbar-brand" href="index.html">Admin Pekawan</a>
    <div class="text-white d-flex align-items-center gap-2">
      <a class="btn btn-sm btn-outline-light" href="index.html">Jadwal</a>
      <a class="btn btn-sm btn-outline-light" href="renungan.html">Renungan</a>
      <a class="btn btn-sm btn-outline-light" href="kegiatan.html">Kegiatan</a>
      <a class="btn btn-sm btn-light" href="dokumentasi.html">Dokumentasi</a>
      <button class="btn btn-sm btn-outline-light" id="logout">Keluar</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <h1 class="h3">Kelola Dokumentasi</h1>

  <div id="msg" class="alert alert-danger" hidden></div>

  <!-- FOTO BINGKAI -->
  <div class="card card-body mb-4">
    <h2 class="h5">Foto Bingkai</h2>
    <div id="bingkai-preview" class="mb-3">
      <div class="foto-jadwal-kosong">
        <i class="bi bi-image"></i>
      </div>
    </div>
    <form id="bingkai-form">
      <label class="form-label">Ganti foto bingkai (JPG, PNG, WEBP, maks. 5 MB)</label>
      <input id="bingkai-file" type="file" accept="image/jpeg,image/png,image/webp"
             class="form-control mb-2" required>
      <button class="btn btn-primary">Unggah foto bingkai</button>
      <button type="button" class="btn btn-outline-danger" id="hapus-bingkai">Hapus foto bingkai</button>
    </form>
  </div>

  <!-- DOKUMENTASI -->
  <div class="card card-body mb-4">
    <h2 class="h5">Unggah dokumentasi</h2>
    <form id="upload-form">
      <label class="form-label">Judul foto</label>
      <input id="judul-foto" class="form-control mb-2">
      <label class="form-label">Foto (JPG, PNG, WEBP, maks. 5 MB)</label>
      <input id="foto" type="file" accept="image/jpeg,image/png,image/webp"
             class="form-control mb-3" required>
      <button class="btn btn-primary">Unggah foto</button>
    </form>
  </div>

  <div class="card card-body">
    <h2 class="h5">Daftar dokumentasi</h2>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr><th style="width:100px">Preview</th><th>Judul</th><th>Path file</th><th>Aksi</th></tr>
        </thead>
        <tbody id="admin-foto"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
