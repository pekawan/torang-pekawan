<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Renungan | Torang Pekawan</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .bg-pekawan { background: #43307c; }
    .btn-pekawan { background: #5b41a0; border-color: #5b41a0; color: #fff; }
    .btn-pekawan:hover { background: #43307c; border-color: #43307c; color: #fff; }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark" style="background:#43307c">
  <div class="container">
    <a class="navbar-brand" href="index.html">Admin Pekawan</a>
    <div class="text-white d-flex align-items-center gap-2">
      <a class="btn btn-sm btn-outline-light" href="index.html">Jadwal</a>
      <a class="btn btn-sm btn-light" href="renungan.html">Renungan</a>
      <a class="btn btn-sm btn-outline-light" href="kegiatan.html">Kegiatan</a>
      <a class="btn btn-sm btn-outline-light" href="dokumentasi.html">Dokumentasi</a>
      <button class="btn btn-sm btn-outline-light" id="logout">Keluar</button>
    </div>
  </div>
</nav>

  <main class="container py-4" style="max-width: 820px;">
    <h1 class="h3 mb-4">Renungan</h1>

    <div id="msg" class="alert" role="status" aria-live="polite" hidden></div>

    <section class="card card-body shadow-sm mb-4">
      <form id="renungan-form">
        <label class="form-label" for="renungan-ayat">Ayat (opsional)</label>
        <input class="form-control mb-3" id="renungan-ayat" maxlength="100" placeholder="Contoh: Yohanes 3:16">

        <label class="form-label" for="renungan-judul">Judul (opsional)</label>
        <input class="form-control mb-3" id="renungan-judul" maxlength="100">

        <label class="form-label" for="renungan-isi">Isi renungan</label>
        <textarea class="form-control mb-1" id="renungan-isi" rows="12" maxlength="5000"></textarea>
        <div class="form-text mb-3"><span id="renungan-hitung">0 / 5000</span> &middot; Enter membuat baris baru.</div>

        <div class="d-flex flex-wrap gap-2">
          <button type="submit" class="btn btn-pekawan">Simpan renungan</button>
          <button type="button" class="btn btn-outline-danger ms-sm-auto" id="hapus-renungan">Kosongkan</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/admin.js"></script>
</body>

</html>
